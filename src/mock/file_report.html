<!doctype html>
<html>
<head><title>Ledger Lite report</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 24px 28px; background: #f6f7fb; color: #1b1f2a; }
h1 { font-size: 22px; margin: 0 0 4px; }
p { margin: 0 0 16px; color: #566; }
.row { display: flex; gap: 12px; }
.card { flex: 1; background: #fff; border: 1px solid #dde1ea; border-radius: 10px; padding: 14px 16px; }
.card b { display: block; font-size: 26px; color: #2f6fed; }
</style></head>
<body>
<h1>Pagination report</h1>
<p>Rows split into pages of 20, last run.</p>
<div class="row">
  <div class="card"><b>1,240</b>rows</div>
  <div class="card"><b>62</b>pages</div>
  <div class="card"><b>0</b>short pages</div>
</div>
<script>document.body.style.background = "red"</script>
</body>
</html>
