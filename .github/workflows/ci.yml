name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  check:
    # Linux's job is not the required "Check (Linux)": that name is the `linux` job below, which also waits for the scenes.
    name: ${{ matrix.job || format('Check ({0})', matrix.name) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, job: 'Linux (fmt, lint, test, packages)' }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-15 }
    steps:
      - uses: actions/checkout@v4

      # Three packages to build (WebKitGTK for the web views over page tabs); the Vulkan software driver to draw pictures on a
      # runner with no GPU; a virtual display, X input and a screen grabber for the web view walk.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-0 mesa-vulkan-drivers xvfb xdotool ffmpeg

      - name: Rust (rust-toolchain.toml)
        run: rustup show

      # Rune is most of the build. Pull requests read the cache; only main writes it.
      - name: Restore the build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      # Component 25, piece E: the signing steps on a runner with no secrets. Each signing script must say "not signed: …
      # is not set" and succeed, then, as a dry run with invented values, print every signing call inside out with no
      # password in it (scripts/check-signing-skipped.sh). The real calls run only in `package`, when the owner adds secrets.
      - name: Signing with no secrets is skipped
        run: |
          cargo build --locked
          bash scripts/check-signing-skipped.sh "target/debug/fleet-native$([ "$RUNNER_OS" = Windows ] && echo .exe)"

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        id: test
        run: cargo test --locked

      # Pull requests draw on Linux only, in the "Scenes (Linux)" jobs below (on Windows and macOS the software
      # renderer already uses every core for one picture, and Rune draws one scene per start, so this step took 500 s
      # on Windows). Pushes to main draw on Windows and macOS here, but Windows draws every 8th scene (both themes of
      # each): at ~3.7 s a scene, all ~2100 took 41 min and hit the job's timeout, which skipped Publish latest.
      - name: Draw every scene
        if: runner.os != 'Linux' && github.event_name != 'pull_request'
        env:
          SNAP_EVERY: ${{ runner.os == 'Windows' && '8' || '1' }}
        run: bash scripts/snap-scenes.sh

      # The updater's replace step on a real system: a copy of this debug build that believes it is build 1 (FLEET_NATIVE_TEST_BUILD) updates itself from a
      # fake release served from loopback (no GitHub). macOS is covered by a test that mounts a real .dmg (cargo test).
      - name: Updater swaps the program (Linux, Windows)
        if: runner.os != 'macOS'
        run: |
          cargo build --locked
          bash scripts/update-check.sh target/debug/fleet-native

      # The Linux packages (.deb, AppImage) built from this debug build with the pinned server, then proven: the desktop file
      # validates, the .deb's control and contents, the AppImage's listing, the server byte for byte (scripts/check-linux-packages.sh).
      # Then each package is started and smoke-tested (scripts/smoke-linux-packages.sh: the .deb from `dpkg -x`, the AppImage's AppRun).
      # The package job does not run on pull requests; this is where a change to the packaging is seen before the merge.
      - name: Cache the server archive (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: server-download
          key: server-linux-x64-${{ hashFiles('packaging/server-version') }}
      - name: Linux packages (.deb, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y desktop-file-utils
          cargo build --locked --example check-bundled-server
          bash scripts/fetch-server.sh linux-x64 server-staged "$PWD/server-download"
          mkdir dist
          bash scripts/make-deb.sh target/debug/fleet-native 1 server-staged dist/fleet-native-linux-x64.deb
          bash scripts/make-appimage.sh target/debug/fleet-native 1 server-staged dist/fleet-native-linux-x64.AppImage
          bash scripts/check-linux-packages.sh dist server-staged target/debug/examples/check-bundled-server
          bash scripts/smoke-linux-packages.sh dist shots/out-smoke

      # The Windows installer (piece C of component 25): a per-user NSIS setup.exe with this debug build and the pinned server
      # inside, built and then proven on the runner (scripts/check-windows-installer.ps1): installed silently into a scratch
      # folder, the files and the server byte for byte, the Start-menu and Apps entries, installed again over itself, refused
      # while the exe is held, the installed app smoke-tested (scripts/smoke-desktop.ps1: its own Fleet started, a repository
      # listed, killed hard, started again on the same data), then uninstalled silently. The runner's image may not carry
      # NSIS; then it comes from Chocolatey.
      - name: Cache the server archive (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: server-download
          key: server-win-x64-${{ hashFiles('packaging/server-version') }}
      - name: Windows installer (NSIS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --example check-bundled-server
          bash scripts/fetch-server.sh win-x64 server-staged "$PWD/server-download"
          if ! command -v makensis >/dev/null && [ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then choco install nsis -y --no-progress; fi
          pwsh -NoProfile -File scripts/make-installer.ps1 -Exe target/debug/fleet-native.exe -Build 1 -Server server-staged -Out dist/fleet-native-windows-x64-setup.exe
          pwsh -NoProfile -File scripts/check-windows-installer.ps1 -Setup dist/fleet-native-windows-x64-setup.exe -Exe target/debug/fleet-native.exe -Build 1 -Server server-staged -Checker target/debug/examples/check-bundled-server.exe -Smoke -Shot shots/out-smoke/smoke-windows-installed.png

      # The macOS bundle (piece D of component 25): "Fleet Native.app" with the pinned server inside, signed inside out, in a
      # .dmg, built from this debug build and proven (scripts/check-mac-app.sh: the plist, every Mach-O passes codesign --verify,
      # the server byte for byte up to the signature), then mounted and run (scripts/check-mac-dmg.sh).
      - name: Cache the server archive (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: server-download
          key: server-osx-arm64-${{ hashFiles('packaging/server-version') }}
      - name: macOS bundle (.app, .dmg)
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --example check-bundled-server
          bash scripts/fetch-server.sh osx-arm64 server-staged "$PWD/server-download"
          mkdir dist
          CHECK_SERVER_CMD=target/debug/examples/check-bundled-server \
            bash scripts/make-mac-app.sh target/debug/fleet-native 1 dist/fleet-native-macos-arm64.dmg server-staged
          hdiutil imageinfo dist/fleet-native-macos-arm64.dmg | sed -n '1,12p' || true
          bash scripts/check-mac-dmg.sh dist/fleet-native-macos-arm64.dmg server-staged target/debug/examples/check-bundled-server shots/out-mac
      - name: Upload the macOS bundle's checks
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-bundle-checks
          path: shots/out-mac/
          if-no-files-found: warn

      - name: Upload the smoke runs' pictures
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: shots/out-smoke/
          if-no-files-found: warn

      # Row 25.44: a pull request that touches packaging gets its packages (debug builds, build 1) as artifacts to try, kept a
      # week; never released. The diff is against the pull request's base, fetched alone (the checkout is shallow).
      - name: Does this change touch packaging
        id: touches
        if: always() && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(packaging/|assets/icon/|build\.rs$|\.github/workflows/(ci|verify-release)\.yml$|scripts/(make-|check-|smoke-|fetch-server))'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"; echo "touches packaging: upload the packages"
          else
            echo "no packaging change"
          fi
      - name: Upload the packages (pull requests that touch packaging)
        if: always() && steps.touches.outputs.packaging == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}-debug
          path: dist/
          retention-days: 7
          if-no-files-found: warn

      # A web view is a native window, so no scene can draw it: the app runs in a real window on an invented page canvas served
      # from tests/fixtures/web, with real OS input, and grabs the whole screen after each step (scripts/web-walk.sh).
      # macOS clicks and types with cliclick, if the runner lets a process send input.
      - name: Web view walk
        if: always() && steps.test.outcome != 'skipped'
        timeout-minutes: 12
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install cliclick >/dev/null || true; fi
          cargo build --locked
          bash scripts/web-walk.sh target/debug/fleet-native shots/out-web

      - name: Upload the web view walk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-walk-${{ matrix.name }}
          path: shots/out-web/
          if-no-files-found: warn

      - name: Upload the pictures
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: scenes-${{ matrix.name }}
          path: shots/out/
          if-no-files-found: warn

      - name: Save the build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  # Linux draws every scene in 4 jobs at once: the picture step was 805 s for 2113 scenes on one 4-core runner that was
  # already full (one process per scene, 4 at a time), so more workers in one job gained nothing. Each job builds the
  # debug binary from the same cache as the Linux checks (main saves it) and draws every 4th scene.
  scenes:
    name: Scenes (Linux, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-0 mesa-vulkan-drivers
      - name: Rust (rust-toolchain.toml)
        run: rustup show
      - name: Restore the build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Draw this share of the scenes
        env:
          SNAP_SHARDS: 4
          SNAP_SHARD: ${{ matrix.shard }}
        run: bash scripts/snap-scenes.sh
      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenes-Linux-${{ matrix.shard }}
          path: shots/out/
          if-no-files-found: warn

  # The required check "Check (Linux)": green only when the Linux job and every share of the scenes succeeded.
  # `always()` so a failed or cancelled job fails this one instead of skipping it (a skipped required check
  # counts as passing). `needs.check` is the whole matrix, so a Windows or macOS failure turns this red too; that
  # run was red anyway, and those two have their own required checks.
  linux:
    name: Check (Linux)
    if: always()
    needs: [check, scenes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          CHECK: ${{ needs.check.result }}
          SCENES: ${{ needs.scenes.result }}
        run: |
          echo "check: $CHECK, scenes: $SCENES"
          [ "$CHECK" = success ] && [ "$SCENES" = success ]

  # A release build of each system's app, to download and try. Not on pull requests.
  package:
    name: Package (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, server: linux-x64 }
          - { name: windows-x64, os: windows-latest, server: win-x64 }
          - { name: macos-arm64, os: macos-15, server: osx-arm64 }
    # Signing (component 25, piece E) runs only when the owner has added the secrets (rows 25.20 to 25.25 name them). Only
    # whether each is set is visible job-wide; the values go to the steps that sign, never to the build.
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Rust (rust-toolchain.toml)
        run: rustup show

      - name: Restore the build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # On Windows, link the C runtime in, so the exe runs without the Visual C++ redistributable.
      - name: Build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          # Baked in: `--version` prints them and the updater compares them.
          export FLEET_NATIVE_BUILD="${{ github.run_number }}" FLEET_NATIVE_COMMIT="${{ github.sha }}"
          cargo build --release --locked

      # Fleet's server goes inside every package: the pinned release archive (packaging/server-version), its SHA-256
      # checked before anything is unpacked, staged as `fleet/` beside the exe. The archive is cached by the pin.
      - name: Cache the server archive
        uses: actions/cache@v4
        with:
          path: server-download
          key: server-${{ matrix.server }}-${{ hashFiles('packaging/server-version') }}
      - name: Fetch Fleet's server
        shell: bash
        run: bash scripts/fetch-server.sh "${{ matrix.server }}" server-staged "$PWD/server-download"
      - name: Build the package checker
        shell: bash
        run: cargo build --release --locked --example check-bundled-server

      # Authenticode (row 25.23): the exe and the server's own exe and dlls are signed before anything is packed, so the zip
      # and the installer carry the same signed files (the installer itself is signed in scripts/make-installer.ps1).
      - name: Sign the program and the server (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh -NoProfile -File scripts/sign-windows.ps1 target/release/fleet-native.exe server-staged
      - name: Not signed (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE != 'true'
        run: pwsh -NoProfile -File scripts/sign-windows.ps1 target/release/fleet-native.exe

      # Windows gets the zip it expects (the exe carries its icon and version information, see build.rs).
      # macOS gets a .dmg holding a signed "Fleet Native.app" (scripts/make-mac-app.sh). Linux gets a tar,
      # which keeps the "can run" bit, with a desktop file and icon beside the program.
      # Each carries the server in `fleet/` beside the exe (macOS: Contents/Resources/fleet).
      # The file names are the release's asset names.
      # make-mac-app.sh signs with the Developer ID and notarises, and make-installer.ps1 signs the setup.exe, when these are
      # set (scripts/sign-mac.sh, scripts/sign-windows.ps1); unset, each says "not signed: … is not set" and goes on.
      - name: Collect
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir package
            cp target/release/fleet-native.exe README.md package/
            cp -r server-staged package/fleet
            # pwsh (7), not Windows PowerShell 5.1: that one writes backslashes into the zip's entry names.
            pwsh -NoProfile -Command "Compress-Archive -Path package/* -DestinationPath dist/fleet-native-windows-x64.zip"
            # The installer carries the same exe and server (a download beside the zip, with its .sha256; not an update asset).
            if ! command -v makensis >/dev/null && [ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then choco install nsis -y --no-progress; fi
            pwsh -NoProfile -File scripts/make-installer.ps1 -Exe target/release/fleet-native.exe -Build "${{ github.run_number }}" -Server server-staged -Out dist/fleet-native-windows-x64-setup.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            CHECK_SERVER_CMD=target/release/examples/check-bundled-server \
              bash scripts/make-mac-app.sh target/release/fleet-native "${{ github.run_number }}" dist/fleet-native-macos-arm64.dmg server-staged
          else
            mkdir package
            cp target/release/fleet-native packaging/fleet-native.desktop packaging/fleet-native.png README.md package/
            cp -r server-staged package/fleet
            tar -czf "dist/fleet-native-${{ matrix.name }}.tar.gz" -C package .
            # The AppImage and the .deb carry the same program and server; a .sha256 beside each Linux file.
            bash scripts/make-deb.sh target/release/fleet-native "${{ github.run_number }}" server-staged dist/fleet-native-linux-x64.deb
            bash scripts/make-appimage.sh target/release/fleet-native "${{ github.run_number }}" server-staged dist/fleet-native-linux-x64.AppImage
            (cd dist && sha256sum fleet-native-linux-x64.tar.gz > fleet-native-linux-x64.tar.gz.sha256)
          fi
          ls -la dist

      # Optional detached GPG signatures of the Linux files (row 25.25), `<file>.asc` beside each; the .sha256 files stand
      # either way.
      - name: Sign the Linux packages (GPG)
        if: runner.os == 'Linux' && env.HAS_GPG_PRIVATE_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/sign-linux.sh dist/fleet-native-linux-x64.tar.gz dist/fleet-native-linux-x64.deb dist/fleet-native-linux-x64.AppImage
      - name: Not signed (Linux)
        if: runner.os == 'Linux' && env.HAS_GPG_PRIVATE_KEY != 'true'
        run: bash scripts/sign-linux.sh dist/fleet-native-linux-x64.AppImage

      # The package carries the server as pinned: every file, byte for byte, and nothing else. (macOS is checked
      # inside scripts/make-mac-app.sh, on the signed app.)
      - name: Check the server in the package (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          rm -rf unpacked && mkdir unpacked
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command "Expand-Archive dist/fleet-native-windows-x64.zip -DestinationPath unpacked"
          else
            tar -xzf dist/fleet-native-linux-x64.tar.gz -C unpacked
          fi
          target/release/examples/check-bundled-server server-staged unpacked
          du -sh dist/* server-staged

      - name: Check the Linux packages (.deb, AppImage)
        if: runner.os == 'Linux'
        run: bash scripts/check-linux-packages.sh dist server-staged target/release/examples/check-bundled-server
      # Each package started and smoke-tested (row 25.41): the .deb, the AppImage and the tar.
      - name: Smoke-test the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-x11-0 mesa-vulkan-drivers xvfb ffmpeg
          bash scripts/smoke-linux-packages.sh dist shots/out-smoke

      # Prove the package before it can be published.
      # The app, its signature and the Applications link are proven in scripts/make-mac-app.sh before the .dmg is
      # built. Here the .dmg itself is checked without mounting it: the runner's disk-image service is flaky.
      - name: Check the package (macOS)
        if: runner.os == 'macOS'
        run: |
          # Retry with backoff: "Resource temporarily unavailable" is the runner's service, not the image.
          # If that is the only failure after every try, warn and pass; any other error fails.
          check_dmg() {
            for cmd in verify imageinfo; do
              ok=0
              for i in 1 2 3 4 5 6; do
                if out=$(hdiutil "$cmd" dist/fleet-native-macos-arm64.dmg 2>&1); then
                  echo "$out"; ok=1; break
                fi
                echo "hdiutil $cmd try $i: $out"
                case "$out" in
                  *"Resource temporarily unavailable"*) ;;
                  *) return 1 ;;
                esac
                sleep $((i * 5 > 30 ? 30 : i * 5))
              done
              if [ "$ok" = 0 ]; then
                echo "::warning::hdiutil $cmd: disk-image service unavailable after 6 tries; the app inside was verified before packing"
                return 0
              fi
            done
          }
          check_dmg
      # Best effort: mounting is nice to prove, but a flaky mount must not fail the package. Checks the volume's title and
      # the app inside, runs the app from the image and grabs the screen (scripts/check-mac-dmg.sh).
      # With the Apple secrets the app and image carry a Developer ID signature and a stapled notarisation ticket, which
      # Gatekeeper accepts (rows 25.21, 25.27); without them this says what the package has instead.
      - name: Check the Developer ID signature (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        run: |
          codesign -dv --verbose=2 dist/fleet-native-macos-arm64.dmg 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp)='
          xcrun stapler validate dist/fleet-native-macos-arm64.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/fleet-native-macos-arm64.dmg
      - name: Not signed (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE != 'true'
        run: |
          echo "not signed: APPLE_CERTIFICATE is not set (the app is signed ad hoc and not notarised)"
      - name: Mount the package and run the app (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/check-mac-dmg.sh dist/fleet-native-macos-arm64.dmg server-staged target/release/examples/check-bundled-server shots/out-mac
      - name: Upload the macOS package's checks
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-package-checks
          path: shots/out-mac/
          if-no-files-found: warn
      - name: Check the package (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -Command "
            \$f = Get-Item target/release/fleet-native.exe
            \$v = \$f.VersionInfo
            \$v | Format-List ProductName,FileDescription,CompanyName,FileVersion,ProductVersion
            if (\$v.CompanyName -ne 'Weave' -or \$v.ProductName -ne 'Fleet Native') { throw 'version information missing' }
            Add-Type -AssemblyName System.Drawing
            \$i = [System.Drawing.Icon]::ExtractAssociatedIcon(\$f.FullName)
            # The generic exe icon has no dark tile; ours does (18,20,28) with a blue mark.
            \$b = \$i.ToBitmap()
            \$c = \$b.GetPixel(\$b.Width / 2, 3)
            'icon ' + \$b.Width + 'x' + \$b.Height + ' top-middle pixel ' + \$c
            if (\$c.R -gt 60 -or \$c.B -gt 70 -or \$c.A -lt 200) { throw 'the Weave icon is not in the exe' }"
          # Row 25.43: nothing in the zip needs the Visual C++ redistributable (the exe links the C runtime in).
          pwsh -NoProfile -File scripts/check-windows-runtime.ps1 unpacked
          # Row 25.41: the zip, unpacked, and the installed app each start their own Fleet and stop with it.
          pwsh -NoProfile -File scripts/smoke-desktop.ps1 -App unpacked/fleet-native.exe -Shot shots/out-smoke/smoke-windows-zip.png
          pwsh -NoProfile -File scripts/check-windows-installer.ps1 -Setup dist/fleet-native-windows-x64-setup.exe -Exe target/release/fleet-native.exe -Build "${{ github.run_number }}" -Server server-staged -Checker target/release/examples/check-bundled-server.exe -Smoke -Shot shots/out-smoke/smoke-windows-installed.png
      - name: Check the Authenticode signatures (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        run: |
          pwsh -NoProfile -Command "
            foreach (\$f in 'target/release/fleet-native.exe', 'server-staged/WeaveFleet.Api.exe', 'dist/fleet-native-windows-x64-setup.exe') {
              \$s = Get-AuthenticodeSignature \$f
              '{0}: {1}, {2}, timestamped by {3}' -f \$f, \$s.Status, \$s.SignerCertificate.Subject, \$s.TimeStamperCertificate.Subject
              if (\$s.Status -ne 'Valid' -or -not \$s.TimeStamperCertificate) { throw \"\$f is not validly signed and timestamped\" }
            }"
      - name: Upload the smoke runs' pictures
        if: runner.os != 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-${{ matrix.name }}
          path: shots/out-smoke/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: fleet-native-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

      - name: Save the build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  # The rolling `latest` pre-release: the only job that can write to the repository.
  publish:
    name: Publish latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, scenes, linux, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # One publish at a time; a waiting one is replaced by a newer one. scripts/publish-release.sh also
    # refuses to replace a release that has a higher build number than this run.
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fleet-native-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          # Only whether each is set, for the notes' line on signing.
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: bash scripts/publish-release.sh dist
