name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-15 }
    steps:
      - uses: actions/checkout@v4

      # Three packages to build (WebKitGTK for the web views over page tabs); the Vulkan software driver to draw pictures on a
      # runner with no GPU; a virtual display, X input and a screen grabber for the web view walk.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-0 mesa-vulkan-drivers xvfb xdotool ffmpeg

      - name: Rust (rust-toolchain.toml)
        run: rustup show

      # Rune is most of the build. Pull requests read the cache; only main writes it.
      - name: Restore the build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        id: test
        run: cargo test --locked

      # Pull requests draw on Linux only: on Windows and macOS the software renderer already uses every
      # core for one picture, and Rune draws one scene per start, so this step took 500 s on Windows.
      # Pushes to main draw on all three systems, but Windows draws every 8th scene (both themes of each):
      # at ~3.7 s a scene, all ~700 took 41 min and hit the job's timeout, which skipped Publish latest.
      # Linux draws every scene on pull requests and main; macOS (about 7 min) draws every scene.
      - name: Draw every scene
        if: runner.os == 'Linux' || github.event_name != 'pull_request'
        env:
          SNAP_EVERY: ${{ runner.os == 'Windows' && '8' || '1' }}
        run: bash scripts/snap-scenes.sh

      # The updater's replace step on a real system: a copy of this debug build that believes it is build 1 (FLEET_NATIVE_TEST_BUILD) updates itself from a
      # fake release served from loopback (no GitHub). macOS is covered by a test that mounts a real .dmg (cargo test).
      - name: Updater swaps the program (Linux, Windows)
        if: runner.os != 'macOS'
        run: |
          cargo build --locked
          bash scripts/update-check.sh target/debug/fleet-native

      # The Linux packages (.deb, AppImage) built from this debug build with the pinned server, then proven: the desktop file
      # validates, the .deb's control and contents, the AppImage's listing, the server byte for byte (scripts/check-linux-packages.sh).
      # The package job does not run on pull requests; this is where a change to the packaging is seen before the merge.
      - name: Cache the server archive (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: server-download
          key: server-linux-x64-${{ hashFiles('packaging/server-version') }}
      - name: Linux packages (.deb, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y desktop-file-utils
          cargo build --locked --example check-bundled-server
          bash scripts/fetch-server.sh linux-x64 server-staged "$PWD/server-download"
          mkdir dist
          bash scripts/make-deb.sh target/debug/fleet-native 1 server-staged dist/fleet-native-linux-x64.deb
          bash scripts/make-appimage.sh target/debug/fleet-native 1 server-staged dist/fleet-native-linux-x64.AppImage
          bash scripts/check-linux-packages.sh dist server-staged target/debug/examples/check-bundled-server

      # A web view is a native window, so no scene can draw it: the app runs in a real window on an invented page canvas served
      # from tests/fixtures/web, with real OS input, and grabs the whole screen after each step (scripts/web-walk.sh).
      # macOS clicks and types with cliclick, if the runner lets a process send input.
      - name: Web view walk
        if: always() && steps.test.outcome != 'skipped'
        timeout-minutes: 12
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install cliclick >/dev/null || true; fi
          cargo build --locked
          bash scripts/web-walk.sh target/debug/fleet-native shots/out-web

      - name: Upload the web view walk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-walk-${{ matrix.name }}
          path: shots/out-web/
          if-no-files-found: warn

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenes-${{ matrix.name }}
          path: shots/out/
          if-no-files-found: warn

      - name: Save the build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  # A release build of each system's app, to download and try. Not on pull requests.
  package:
    name: Package (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, server: linux-x64 }
          - { name: windows-x64, os: windows-latest, server: win-x64 }
          - { name: macos-arm64, os: macos-15, server: osx-arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libxkbcommon-dev libwayland-dev libwebkit2gtk-4.1-dev desktop-file-utils

      - name: Rust (rust-toolchain.toml)
        run: rustup show

      - name: Restore the build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # On Windows, link the C runtime in, so the exe runs without the Visual C++ redistributable.
      - name: Build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          # Baked in: `--version` prints them and the updater compares them.
          export FLEET_NATIVE_BUILD="${{ github.run_number }}" FLEET_NATIVE_COMMIT="${{ github.sha }}"
          cargo build --release --locked

      # Fleet's server goes inside every package: the pinned release archive (packaging/server-version), its SHA-256
      # checked before anything is unpacked, staged as `fleet/` beside the exe. The archive is cached by the pin.
      - name: Cache the server archive
        uses: actions/cache@v4
        with:
          path: server-download
          key: server-${{ matrix.server }}-${{ hashFiles('packaging/server-version') }}
      - name: Fetch Fleet's server
        shell: bash
        run: bash scripts/fetch-server.sh "${{ matrix.server }}" server-staged "$PWD/server-download"
      - name: Build the package checker
        shell: bash
        run: cargo build --release --locked --example check-bundled-server

      # Windows gets the zip it expects (the exe carries its icon and version information, see build.rs).
      # macOS gets a .dmg holding a signed "Fleet Native.app" (scripts/make-mac-app.sh). Linux gets a tar,
      # which keeps the "can run" bit, with a desktop file and icon beside the program.
      # Each carries the server in `fleet/` beside the exe (macOS: Contents/Resources/fleet).
      # The file names are the release's asset names.
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir package
            cp target/release/fleet-native.exe README.md package/
            cp -r server-staged package/fleet
            # pwsh (7), not Windows PowerShell 5.1: that one writes backslashes into the zip's entry names.
            pwsh -NoProfile -Command "Compress-Archive -Path package/* -DestinationPath dist/fleet-native-windows-x64.zip"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            CHECK_SERVER_CMD=target/release/examples/check-bundled-server \
              bash scripts/make-mac-app.sh target/release/fleet-native "${{ github.run_number }}" dist/fleet-native-macos-arm64.dmg server-staged
          else
            mkdir package
            cp target/release/fleet-native packaging/fleet-native.desktop packaging/fleet-native.png README.md package/
            cp -r server-staged package/fleet
            tar -czf "dist/fleet-native-${{ matrix.name }}.tar.gz" -C package .
            # The AppImage and the .deb carry the same program and server; a .sha256 beside each Linux file.
            bash scripts/make-deb.sh target/release/fleet-native "${{ github.run_number }}" server-staged dist/fleet-native-linux-x64.deb
            bash scripts/make-appimage.sh target/release/fleet-native "${{ github.run_number }}" server-staged dist/fleet-native-linux-x64.AppImage
            (cd dist && sha256sum fleet-native-linux-x64.tar.gz > fleet-native-linux-x64.tar.gz.sha256)
          fi
          ls -la dist

      # The package carries the server as pinned: every file, byte for byte, and nothing else. (macOS is checked
      # inside scripts/make-mac-app.sh, on the signed app.)
      - name: Check the server in the package (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          rm -rf unpacked && mkdir unpacked
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command "Expand-Archive dist/fleet-native-windows-x64.zip -DestinationPath unpacked"
          else
            tar -xzf dist/fleet-native-linux-x64.tar.gz -C unpacked
          fi
          target/release/examples/check-bundled-server server-staged unpacked
          du -sh dist/* server-staged

      - name: Check the Linux packages (.deb, AppImage)
        if: runner.os == 'Linux'
        run: bash scripts/check-linux-packages.sh dist server-staged target/release/examples/check-bundled-server

      # Prove the package before it can be published.
      # The app, its signature and the Applications link are proven in scripts/make-mac-app.sh before the .dmg is
      # built. Here the .dmg itself is checked without mounting it: the runner's disk-image service is flaky.
      - name: Check the package (macOS)
        if: runner.os == 'macOS'
        run: |
          # Retry with backoff: "Resource temporarily unavailable" is the runner's service, not the image.
          # If that is the only failure after every try, warn and pass; any other error fails.
          check_dmg() {
            for cmd in verify imageinfo; do
              ok=0
              for i in 1 2 3 4 5 6; do
                if out=$(hdiutil "$cmd" dist/fleet-native-macos-arm64.dmg 2>&1); then
                  echo "$out"; ok=1; break
                fi
                echo "hdiutil $cmd try $i: $out"
                case "$out" in
                  *"Resource temporarily unavailable"*) ;;
                  *) return 1 ;;
                esac
                sleep $((i * 5 > 30 ? 30 : i * 5))
              done
              if [ "$ok" = 0 ]; then
                echo "::warning::hdiutil $cmd: disk-image service unavailable after 6 tries; the app inside was verified before packing"
                return 0
              fi
            done
          }
          check_dmg
      # Best effort: mounting is nice to prove, but a flaky mount must not fail the package.
      - name: Mount the package (macOS, best effort)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            hdiutil attach dist/fleet-native-macos-arm64.dmg -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -readonly && break
            [ "$i" = 3 ] && { echo "::warning::could not mount the .dmg"; exit 0; }
            sleep $((i * 3))
          done
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Fleet Native.app"
          test -L "$RUNNER_TEMP/dmg/Applications"
          hdiutil detach "$RUNNER_TEMP/dmg" || hdiutil detach "$RUNNER_TEMP/dmg" -force
      - name: Check the package (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -Command "
            \$f = Get-Item target/release/fleet-native.exe
            \$v = \$f.VersionInfo
            \$v | Format-List ProductName,FileDescription,CompanyName,FileVersion,ProductVersion
            if (\$v.CompanyName -ne 'Weave' -or \$v.ProductName -ne 'Fleet Native') { throw 'version information missing' }
            Add-Type -AssemblyName System.Drawing
            \$i = [System.Drawing.Icon]::ExtractAssociatedIcon(\$f.FullName)
            # The generic exe icon has no dark tile; ours does (18,20,28) with a blue mark.
            \$b = \$i.ToBitmap()
            \$c = \$b.GetPixel(\$b.Width / 2, 3)
            'icon ' + \$b.Width + 'x' + \$b.Height + ' top-middle pixel ' + \$c
            if (\$c.R -gt 60 -or \$c.B -gt 70 -or \$c.A -lt 200) { throw 'the Weave icon is not in the exe' }"

      - uses: actions/upload-artifact@v4
        with:
          name: fleet-native-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

      - name: Save the build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  # The rolling `latest` pre-release: the only job that can write to the repository.
  publish:
    name: Publish latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # One publish at a time; a waiting one is replaced by a newer one. scripts/publish-release.sh also
    # refuses to replace a release that has a higher build number than this run.
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fleet-native-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: bash scripts/publish-release.sh dist
