# Weave Fleet as a native desktop app, built with Rune (github.com/anomalyco/rune). See README.md.
[package]
name = "fleet-native"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6", features = ["tooling"] }
# Markdown (CommonMark, tables, streaming) and the syntax highlighter. Pulls in pulldown-cmark and
# Rune's own lexer crates; no other new crates.
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6", features = ["markdown"] }

# System notifications (src/desktop/notify.rs): UNUserNotificationCenter on macOS, toasts on Windows; off those every call does nothing, so
# it is named for every target. Rune's own crate, at Rune's rev (a sixth place a pin move changes).
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }

# The server connection (src/fleet/). Blocking calls on plain threads, no async runtime.
serde_json = "1"
# Find in a file's "regexp" box (src/conv/file_find.rs). Already built for alacritty_terminal's search (regex-automata, regex-syntax);
# `regex` itself is the one new crate, with the Unicode tables only.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
# `rustls` is for the updater (https://github.com/.../releases) and for every machine served over https (a Fleet behind
# `tailscale serve`): the same TLS stack as the hub's wss socket below. Not a new crate.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The hub's wss:// socket (src/fleet/tls.rs) uses the rustls and root certificates ureq already brings (same `ring` provider,
# same webpki-roots), so Cargo.lock gains no crate; they are named here only to call them directly.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The updater: the SHA-256 of a download, and the two archives (.tar.gz on Linux, .zip on Windows) it opens. `flate2` is
# already in Cargo.lock through Rune's image crates; `zip` takes it for deflate, and `tar` is a few hundred lines.
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# The terminal drawer's state (src/term/): the parser, the grid with its scrollback and reflow, the modes xterm.js has. Fleet's
# terminal is xterm.js, which has no Rust port; docs/research/terminal.md compares the candidates. Its own pty and I/O loop come
# along unused (the shell is the server's). Apache-2.0.
alacritty_terminal = "0.26"
# `new URL(...)` of the browser tab (src/web/browser.rs): the address bar parses what is typed as the page does. Already in Cargo.lock
# through wry, built for all three systems; no new crate.
url = "2"

# The tray's icon (`src/desktop/tray.rs`): `assets/tray.png` decoded to the pixels Rune's tray takes. Rune builds this same
# version already, so Cargo.lock gains no crate.
png = "0.18"

# The system web view (WebView2, WKWebView, WebKitGTK) as a child of the window, for page canvases (component 14, `src/web/`).
# `--no-default-features` builds without it: every page then shows the "can't be shown inside the app" panel.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wry = { version = "0.57", optional = true }

# WebKitGTK runs on GTK's main loop, which the app turns from `poll`; wry needs `gtk::init` before its first web view.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
# Linux notifications (src/desktop/notify.rs): `org.freedesktop.Notifications` over D-Bus, on a thread with its own small runtime. All
# three are in Cargo.lock already through Rune's tray and file dialogs, at these versions.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[features]
default = ["web"]
web = ["dep:wry", "dep:gtk", "dep:windows"]

# The pid check of the instance file (`kill(pid, 0)`); already in Cargo.lock through Rune.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The updater on Windows: swap the running exe for the new one (rename it aside, put the new one in its place, delete the
# old one after exit). The dance has traps (a locked file, a path that moves), so a small maintained crate does it.
[target.'cfg(windows)'.dependencies]
self-replace = "1"
# WebView2 needs the UI thread in a single-threaded COM apartment. Rune already builds this crate.
windows = { version = "0.62", features = ["Win32_System_Com"], optional = true }

# Windows icon and version information (build.rs). Build time only: nothing of it is in the exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# Rune patches these crates, and a dependency's [patch] doesn't reach the app that depends on it,
# so the app repeats them from the same rev (Rune's README, "Depending on Rune").
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "f1f54ce8bf485ee3a95804deace315f53a8970f6" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 16
